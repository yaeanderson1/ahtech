services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ahtech}
      POSTGRES_USER: ${POSTGRES_USER:-ahtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ahtech_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-ahtech} -d ${POSTGRES_DB:-ahtech}"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ahtech}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ahtech}
      AHTECH_SECRET_KEY: ${AHTECH_SECRET_KEY}
      AHTECH_ADMIN_EMAIL: ${AHTECH_ADMIN_EMAIL}
      AHTECH_ADMIN_PASSWORD: ${AHTECH_ADMIN_PASSWORD}
      AHTECH_ADMIN_NAME: ${AHTECH_ADMIN_NAME:-Administrador}
      AHTECH_COOKIE_SECURE: "1"
    expose:
      - "8080"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  ahtech_pg:
  caddy_data:
  caddy_config:
