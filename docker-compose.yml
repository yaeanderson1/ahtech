services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ahtech}
      POSTGRES_USER: ${POSTGRES_USER:-ahtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - ahtech_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-ahtech} -d ${POSTGRES_DB:-ahtech}"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ahtech}:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/${POSTGRES_DB:-ahtech}
      AHTECH_SECRET_KEY: ${AHTECH_SECRET_KEY:-troque-uma-chave-secreta-grande}
      AHTECH_ADMIN_EMAIL: ${AHTECH_ADMIN_EMAIL:-admin@ahtech.com}
      AHTECH_ADMIN_PASSWORD: ${AHTECH_ADMIN_PASSWORD:-troque-esta-senha}
      AHTECH_ADMIN_NAME: ${AHTECH_ADMIN_NAME:-Administrador}
      AHTECH_COOKIE_SECURE: ${AHTECH_COOKIE_SECURE:-0}
    ports:
      - "8080:8080"
volumes:
  ahtech_pg:
